<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keamanan Maksimal | Verifikasi Klien</title>
    <style>
        :root {
            --bg-color: #050508;
            --text-color: #00ffcc;
            --danger-color: #ff3366;
            --terminal-font: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--terminal-font);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }
        .shield-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        .loader {
            border: 3px solid rgba(0, 255, 204, 0.1);
            border-top: 3px solid var(--text-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        #status-text {
            font-size: 1.3em;
            letter-spacing: 2px;
            margin-top: 15px;
            font-weight: bold;
        }
        #threat-level {
            font-size: 0.9em;
            color: #888;
            margin-top: 10px;
        }
        .log-container {
            margin-top: 30px;
            font-size: 0.85em;
            color: #4a9e9e;
            text-align: left;
            width: 90%;
            max-width: 500px;
            height: 120px;
            overflow-y: auto;
            background: rgba(0, 255, 204, 0.05);
            padding: 15px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .log-line { margin: 5px 0; border-bottom: 1px dashed rgba(0, 255, 204, 0.1); padding-bottom: 3px; }
        .log-error { color: var(--danger-color); }
        .log-warning { color: #ffcc00; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 
            0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 10px var(--text-color)); } 
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 25px var(--text-color)); } 
        }
    </style>
</head>
<body>

    <div class="shield-icon" id="icon">🛡️</div>
    <h2>Verifikasi Integritas Sistem</h2>
    <div class="loader" id="spinner"></div>
    <div id="status-text">Memulai pemindaian mendalam...</div>
    <div id="threat-level">Skor Ancaman: 0 / 100</div>
    
    <div class="log-container" id="logs"></div>

    <script>
        // =======================================================================
        // UBAH BAGIAN INI
        // Ganti URL ini dengan URL file utama / dashboard rahasia lu.
        // =======================================================================
        const DESTINATION_URL = "main_secure.html";
        
        // =======================================================================
        // UBAH BAGIAN INI
        // Batas maksimal skor ancaman sebelum pengunjung diblokir (0-100).
        // =======================================================================
        const MAX_THREAT_SCORE = 50;

        const logsDiv = document.getElementById('logs');
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const iconDiv = document.getElementById('icon');
        const threatLevelText = document.getElementById('threat-level');

        let threatScore = 0;

        function addLog(message, type = 'info') {
            const p = document.createElement('div');
            p.className = `log-line ${type === 'error' ? 'log-error' : type === 'warning' ? 'log-warning' : ''}`;
            
            const time = new Date().toISOString().split('T')[1].substring(0, 8);
            p.innerText = `[${time}] > ${message}`;
            
            logsDiv.appendChild(p);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function increaseThreat(points, reason) {
            threatScore += points;
            threatLevelText.innerText = `Skor Ancaman: ${threatScore} / 100`;
            addLog(`Peringatan: ${reason} (+${points} skor)`, 'warning');
        }

        async function runDeepScan() {
            try {
                addLog("Memeriksa enkapsulasi frame...");
                if (window.self !== window.top) {
                    increaseThreat(100, "Akses via Iframe/Embed dilarang");
                }

                addLog("Menganalisis anomali User-Agent...");
                const ua = navigator.userAgent.toLowerCase();
                const blacklistedUa = ['curl', 'wget', 'termux', 'python', 'bot', 'spider', 'crawler', 'postman', 'httpclient', 'urllib'];
                if (blacklistedUa.some(agent => ua.includes(agent))) {
                    increaseThreat(100, `Deteksi skrip/bot (${ua})`);
                }

                addLog("Memindai otomasi browser...");
                if (navigator.webdriver === true || window.document.documentElement.getAttribute("webdriver") === "true") {
                    increaseThreat(80, "Browser dikendalikan oleh software otomatis");
                }
                if (window.callPhantom || window._phantom || window.phantom) {
                    increaseThreat(100, "PhantomJS terdeteksi");
                }
                if (window.__nightmare) {
                    increaseThreat(100, "NightmareJS terdeteksi");
                }

                addLog("Memvalidasi sidik jari perangkat keras...");
                if (navigator.hardwareConcurrency === undefined || navigator.hardwareConcurrency < 2) {
                    increaseThreat(20, "Core CPU mencurigakan");
                }
                if (navigator.deviceMemory !== undefined && navigator.deviceMemory < 2) {
                    increaseThreat(20, "Kapasitas memori mencurigakan");
                }
                
                // Pengecekan plugins dihilangkan agar tidak false positive di beberapa browser mobile modern
                
                addLog("Menghitung proporsi antarmuka grafis...");
                if (window.outerWidth === 0 || window.outerHeight === 0) {
                    increaseThreat(60, "Dimensi layar tidak valid (Headless Browser)");
                }

                addLog("Menguji rendering akselerasi GPU...");
                try {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (debugInfo) {
                            const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL).toLowerCase();
                            if (renderer.includes('swiftshader') || renderer.includes('llvmpipe') || renderer.includes('mesa')) {
                                increaseThreat(40, `Software GPU terdeteksi (${renderer})`);
                            }
                        }
                    } else {
                        increaseThreat(50, "WebGL tidak didukung");
                    }
                } catch (e) {
                    increaseThreat(50, "Akses WebGL diblokir");
                }

                addLog("Mengukur integritas clock sistem...");
                const start = performance.now();
                for(let i=0; i<1000000; i++) {} 
                const timeTaken = performance.now() - start;
                if (timeTaken > 500) { 
                    increaseThreat(10, "Performa CPU sangat lambat");
                }

                addLog("Evaluasi akhir selesai.");
                
                setTimeout(() => {
                    if (threatScore >= MAX_THREAT_SCORE) {
                        executeBan();
                    } else {
                        grantAccess();
                    }
                }, 1000);

            } catch (err) {
                addLog(`Terjadi kesalahan saat pemindaian: ${err.message}`, 'error');
                increaseThreat(100, "Bypass attempt / Execution Error");
                executeBan();
            }
        }

        function grantAccess() {
            spinner.style.display = "none";
            iconDiv.innerText = "✅";
            statusText.innerText = "KONEKSI AMAN - MENGALIHKAN...";
            statusText.style.color = "var(--text-color)";
            addLog("Otorisasi diberikan. Membuka protokol tujuan...", 'info');
            
            setTimeout(() => {
                window.location.replace(DESTINATION_URL);
            }, 1500);
        }

        function executeBan() {
            spinner.style.display = "none";
            iconDiv.innerText = "⚠️";
            iconDiv.style.animation = "none";
            iconDiv.style.textShadow = "0 0 20px var(--danger-color)";
            statusText.innerText = "AKSES DITOLAK";
            statusText.style.color = "var(--danger-color)";
            threatLevelText.style.color = "var(--danger-color)";
            addLog("Skor ancaman melebihi batas. Memutus koneksi jaringan.", 'error');
            
            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="text-align: center; margin-top: 30vh; color: #ff3366; font-family: monospace;">
                        <h1 style="font-size: 50px;">403 FORBIDDEN</h1>
                        <p>Koneksi diputus paksa oleh Sistem Keamanan.</p>
                        <p>Alasan: Anomali klien terdeteksi (Score: ${threatScore}).</p>
                    </div>
                `;
            }, 2500);
        }

        setTimeout(runDeepScan, 800);

    </script>
</body>
</html>
